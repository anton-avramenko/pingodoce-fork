# Builds the static export and deploys it to GitHub Pages.
# The site is served under https://<owner>.github.io/<repo>/, so the build
# receives the repository sub-path via NEXT_PUBLIC_BASE_PATH.
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/pwa-card-coupon-poc-fx991i
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two Pages deployments at once
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # Create the Pages site on first run if it doesn't exist yet
          enablement: true

      - name: Build static site
        run: npm run build
        env:
          # e.g. /pingodoce-fork — provided by configure-pages
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
